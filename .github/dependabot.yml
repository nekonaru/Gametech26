# Dependabot: pembaruan terjadwal untuk dependensi runtime & aksi CI.
# Package.json ada di subfolder Game/, jadi ekosistem npm memakai direktori
# itu; github-actions memakai root karena workflow ada di .github/workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /Game
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
